user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 4096; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # 内网 DNS（只给 /s3up/ 这类变量 proxy_pass 用；app 走下面的 127.0.0.1，不经过 DNS）。
  # 网段见 compose.yaml（目前 192.168.77.0/24，网关即 .1）。不要加公网 DNS——会轮询污染，间歇性 502。
  resolver 192.168.77.1 valid=30s ipv6=off;
  resolver_timeout 5s;

  # Nginx 与 app 共享网络命名空间（--network container:app），upstream 直连本机回环：
  # 零 IP 字面量（网段随便换不断流）、长连接复用（万级 QPS 不堆 TIME_WAIT）。
  # 注意：8080 端口发布在 app 容器上；重启 app 后必须顺手重启本容器（netns 跟 app 走）。
  upstream app {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 64;
  }

    # 上传/下载限流（按 IP）
  limit_req_zone $binary_remote_addr zone=upload:10m rate=2r/s;
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

  server {
    listen 80;
    server_name _;

    # 全站安全头（静态+API统一加）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;

    # ★ S3 直传代理变量：默认占位，部署时由启动脚本按 .env 渲染替换（勿提交真实桶名）。
    # 占位值 __S3_HOST__/__S3_BASE__/__S3_BUCKET__/__S3_UA__ 会在 start.sh 中被 sed 替换。
    set $s3_host "__S3_HOST__";
    set $s3_base "__S3_BASE__";
    set $s3_bucket "__S3_BUCKET__";
    set $s3_app_ua "__S3_UA__";

    # 健康检查直通（给容器探针/外部监控）
    location = /healthz { proxy_pass http://app; }

    # API 反代 Node
    location /api/ {
      limit_req zone=api burst=60 nodelay;
      proxy_pass http://app;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_connect_timeout 5s;
      proxy_read_timeout 60s;
      # 大文件走直传，普通上传 60MB 封顶
      client_max_body_size 60m;
    }
    location = /api/health { proxy_pass http://app; }

    # S3 预签名 POST 经此转发：POST /s3up/<key>（表单含 policy/signature/file）→ S3 真地址
    location ~ ^/s3up/(?<s3key>.+)$ {
      limit_except POST { deny all; } # 只允许上传 POST，禁掉 GET/DELETE 等借道访问
      limit_req zone=upload burst=10 nodelay;
      client_max_body_size 60m;
      proxy_request_buffering off; # 边收边转，不占 Nginx 内存
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $s3_host; # S3 按 Host 路由（path-style 桶在路径里）
      proxy_set_header User-Agent $s3_app_ua; # 透传固定 UA（部分自建 S3 按 UA 识别客户端）
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_connect_timeout 10s;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
      proxy_pass $s3_base/$s3_bucket/$s3key;
    }

    # 敏感路径直接 404（Node 层也拦了一道，这里是第一道；(?i) 防大小写绕过；必须在白名单正则之前）
    location ~* ^/(backend|node_modules|\.git)/ { return 404; }
    location ~* (\.env$|all_code\.txt$|compose\.yaml$|containerfile$|start\.sh$|stop\.sh$|package(-lock)?\.json$|schema\.sql$) { return 404; }

    # 静态前端：只放行页面/资源文件，其余一律 404（防项目根全挂载泄密）
    # 注意：本 location 写了 add_header 会覆盖 server 级继承，必须写全 4 个
    location ~* ^/(css|js|uploads)/ {
      root /usr/share/web;
      expires 7d;
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options SAMEORIGIN always;
      add_header Referrer-Policy no-referrer always;
      add_header Content-Security-Policy "sandbox" always;
    }
    location ~* \.(html|css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
      root /usr/share/web;
      expires 1h;
      # 页面 CSP：本站有 inline script/style，放行 unsafe-inline；
      # img/connect 允许 R2 预签名直传域名(https)，object 禁掉防插件执行
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options SAMEORIGIN always;
      add_header Referrer-Policy no-referrer always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    }
    location = / {
      root /usr/share/web;
      index index.html;
      expires 1h;
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options SAMEORIGIN always;
      add_header Referrer-Policy no-referrer always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    }
    location = /index.html {
      root /usr/share/web;
      expires 1h;
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options SAMEORIGIN always;
      add_header Referrer-Policy no-referrer always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    }
    location / {
      return 404;
    }
  }
}
