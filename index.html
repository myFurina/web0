        /* 主题切换所需的额外样式 - 仅用于轮播图颜色自适应，不改变其他原有功能 */
        :root {
            /* 日间模式轮播渐变变量 (与原配色完全一致) */
            --slide1-gradient-light: linear-gradient(135deg, #c7f1ef 0%, #4338ca 100%);
            --slide2-gradient-light: linear-gradient(135deg, #dbe4c4 0%, #059669 100%);
            --slide3-gradient-light: linear-gradient(135deg, #e0c4bf 0%, #dc2626 100%);
            
            /* 夜间模式轮播渐变变量 (优雅深邃配色) */
            --slide1-gradient-dark: linear-gradient(135deg, #1e293b 0%, #2e2a5e 100%);
            --slide2-gradient-dark: linear-gradient(135deg, #2d2a1f 0%, #0b5e42 100%);
            --slide3-gradient-dark: linear-gradient(135deg, #3a0a04 0%, #9b2c2c 100%);
        }
        
        /* 日间模式 (默认) - 轮播图使用日间配色 */
        [data-theme="light"] .slide:nth-child(1) {
            background: var(--slide1-gradient-light) !important;
        }
        [data-theme="light"] .slide:nth-child(2) {
            background: var(--slide2-gradient-light) !important;
        }
        [data-theme="light"] .slide:nth-child(3) {
            background: var(--slide3-gradient-light) !important;
        }
        
        /* 夜间模式 - 轮播图使用夜间配色 */
        [data-theme="dark"] .slide:nth-child(1) {
            background: var(--slide1-gradient-dark) !important;
        }
        [data-theme="dark"] .slide:nth-child(2) {
            background: var(--slide2-gradient-dark) !important;
        }
        [data-theme="dark"] .slide:nth-child(3) {
            background: var(--slide3-gradient-dark) !important;
        }
        
        /* 确保轮播过渡平滑 */
        .slide {
            transition: opacity 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94), visibility 0.7s, background 0.3s ease;
        }
    </style>

		   }
		   
           //if (logoutBtn) logoutBtn.style.display = 'inline';
       
           // 【核心修复】管理员回后台的逻辑
           // 确保你的 HTML 中有 <li id="adminEntrance" style="display:none;"><a href="admin.html">后台</a></li>
           const adminEntrance = document.getElementById('adminEntrance');
           if (role === 'admin' && adminEntrance) {
               adminEntrance.style.display = 'block'; // 强行显示
               console.log("✅ 检测到管理员权限，已开启后台入口");
           }
       })();
       
       // 2. 轮播图控制逻辑 (确保 DOM 加载后运行)
       document.addEventListener('DOMContentLoaded', () => {
           let currentSlide = 0;
           const slides = document.querySelectorAll('.slide');
           const dots = document.querySelectorAll('.dot');
           
           // 安全检查：如果页面没找到轮播图组件，则不执行，防止报错
           if (slides.length === 0) return;
       
           function showSlide(index) {
               // 移除所有激活状态
               slides.forEach(s => s.classList.remove('active'));
               dots.forEach(d => d.classList.remove('active'));
       
               // 计算循环索引
               currentSlide = (index + slides.length) % slides.length;
       
               // 激活当前项
               slides[currentSlide].classList.add('active');
               dots[currentSlide].classList.add('active');
           }
       
           // 自动播放定时器
           let slideTimer = setInterval(() => {
               showSlide(currentSlide + 1);
           }, 5000);
       
           // 点击圆点切换
           dots.forEach((dot, index) => {
               dot.addEventListener('click', () => {
                   clearInterval(slideTimer); // 清除旧定时器
                   showSlide(index);
                   // 重启定时器
                   slideTimer = setInterval(() => showSlide(currentSlide + 1), 5000);
               });
           });
       
           console.log("🚀 轮播图插件已就绪");
       });
       
       // 3. 安全退出
       async function __doLogout(confirmMsg, target) {
            if (!confirm(confirmMsg)) return;
            try { await fetch('/api/logout', { method: 'POST' }); } catch (_) {}
            localStorage.clear();
            window.location.href = target || 'login.html';
        }
        function logout() {
           __doLogout('确定要退出登录吗？');
        }
	   function login() {
	      
	           window.location.href = 'login.html';
	       
	   }
    </script>
	<script>
	// 主题切换逻辑 - 仅用于轮播图颜色自适应，不修改其他任何功能
	const themeToggle = document.getElementById('themeToggle');
	const html = document.documentElement;
	


    const initTheme = () => {
        const savedTheme = localStorage.getItem('theme') || 'dark';
        html.setAttribute('data-theme', savedTheme);
        themeToggle.textContent = savedTheme === 'light' ? '☀️' : '🌙';
    }

    themeToggle.addEventListener('click', () => {
        const isLight = html.getAttribute('data-theme') === 'light';
        const nextTheme = isLight ? 'dark' : 'light';
        
        html.setAttribute('data-theme', nextTheme);
        themeToggle.textContent = nextTheme === 'light' ? '☀️' : '🌙';
        localStorage.setItem('theme', nextTheme);
    });

    initTheme();
	</script>
