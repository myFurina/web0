<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - TechShare</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            transition: background-color 0.3s;
        }

        .login-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 420px;
            padding: 40px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            position: relative;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 主题切换按钮位置优化 */
        .theme-toggle-wrapper {
            position: absolute;
            top: 20px;
            right: 20px;
        }

        .logo-area {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-icon {
            font-size: 3rem;
            display: block;
            margin-bottom: 10px;
        }

        .logo-text {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin: 0;
        }

        .logo-text span {
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .subtitle {
            text-align: center;
            color: var(--text-gray);
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        .subtitle a {
            color: var(--accent-blue);
            text-decoration: none;
            font-weight: 600;
        }

        .subtitle a:hover { text-decoration: underline; }

        .input-group { margin-bottom: 20px; }

        label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 8px;
            color: var(--text-gray);
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 14px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-main);
            box-sizing: border-box;
            font-size: 1rem;
            transition: 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-purple);
            box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.15);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: var(--gradient-primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(124, 58, 237, 0.3);
            filter: brightness(1.1);
        }

        .login-btn:active { transform: translateY(0); }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* 响应式调整 */
        @media (max-width: 480px) {
            .login-card { padding: 30px 20px; border-radius: 0; min-height: 100vh; border: none; }
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="theme-toggle-wrapper">
        <button id="themeToggle" class="theme-toggle" style="background:none; border:none; cursor:pointer; font-size:1.2rem;">🌙</button>
    </div>

    <div class="logo-area">
        <span class="logo-icon">🌀</span>
        <h1 class="logo-text">Tech<span>Share</span></h1>
    </div>
    
    <p class="subtitle">还没有账号? <a href="register.html">立即注册</a></p>
    <p class="subtitle" style="margin-top:-18px; font-size:0.8rem;">忘记密码？请联系管理员核实身份后重置</p>

    <form id="loginForm">
        <div class="input-group">
            <label>用户名</label>
            <input type="text" id="username" placeholder="请输入用户名" required autocomplete="username">
        </div>
        <div class="input-group">
            <label>密码</label>
            <input type="password" id="password" placeholder="••••••••••••" required autocomplete="current-password">
        </div>
        <button type="submit" id="submitBtn" class="login-btn">登录</button>
    </form>
</div>

<script src="js/api.js"></script>
<script>
    const loginForm = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');

    loginForm.onsubmit = async function(e) {
        e.preventDefault();
        
        // UI 状态反馈
        submitBtn.disabled = true;
        submitBtn.innerText = '验证中...';

        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        try {
            // 走统一封装：网关类故障自动重试一次，成功只返回 JSON
            const result = window.API
                ? await window.API.send('POST', '/api/login', { username, password })
                : await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                }).then(r => r.json());

            if (result.code === 200) {
                // 存储登录状态
                localStorage.setItem('isLogin', 'true');
                localStorage.setItem('username', result.username);
                localStorage.setItem('role', result.role);
                
                if (result.role === 'admin') {
                    alert('管理员 ' + result.username + '，欢迎进入系统！');
                    window.location.href = 'admin.html';
                } else {
                    alert('登录成功！欢迎回来 ' + result.username);
                    window.location.href = 'index.html';
                }
            } else {
                alert('登录失败: ' + result.msg);
                submitBtn.disabled = false;
                submitBtn.innerText = '开启技术之旅';
            }
        } catch (err) {
            // 区分展示：网关故障 / 断网 / 未知，不要一律“连接失败”
            if (err && err.status === 502) alert('网关暂时不可用，已自动重试一次，请再点一次登录');
            else if (err && err.status === 503) alert('服务过载（503），请稍后再试');
            else if (err && err.status) alert('请求失败（HTTP ' + err.status + '），请稍后重试');
            else alert('服务器连接失败，请检查网络');
            submitBtn.disabled = false;
            submitBtn.innerText = '开启技术之旅';
        }
    };

    // --- 主题切换逻辑 ---
    const themeToggle = document.getElementById('themeToggle');
    const html = document.documentElement;

    const initTheme = () => {
        const savedTheme = localStorage.getItem('theme') || 'dark';
        html.setAttribute('data-theme', savedTheme);
        themeToggle.textContent = savedTheme === 'light' ? '☀️' : '🌙';
    }

    themeToggle.addEventListener('click', () => {
        const isLight = html.getAttribute('data-theme') === 'light';
        const nextTheme = isLight ? 'dark' : 'light';
        
        html.setAttribute('data-theme', nextTheme);
        themeToggle.textContent = nextTheme === 'light' ? '☀️' : '🌙';
        localStorage.setItem('theme', nextTheme);
    });

    initTheme();
</script>

</body>
</html>
